<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Jabră • 404 No Encontrado</title>
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="icon" type="image/svg+xml" href="img/jabra.favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
        crossorigin="anonymous" />
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            background: var(--bg-deep);
            min-height: 100vh;
            overflow: hidden;
        }

        .bg-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            opacity: 0.15;
            z-index: -1;
            filter: blur(80px);
            animation: pulse 8s ease-in-out infinite alternate;
        }

        .error-container {
            background: rgba(18, 18, 20, 0.4);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            max-width: 420px;
            width: 90%;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            animation: slideIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        /* Floating music notes animation */
        .notes-container {
            position: absolute;
            top: -60px;
            left: 0;
            right: 0;
            height: 100px;
            overflow: hidden;
            pointer-events: none;
        }

        .note {
            position: absolute;
            color: var(--accent);
            opacity: 0;
            animation: floatNote 3s ease-out infinite;
            font-size: 24px;
        }

        .note:nth-child(1) {
            left: 20%;
            animation-delay: 0.5s;
            font-size: 20px;
        }

        .note:nth-child(2) {
            left: 50%;
            animation-delay: 1.2s;
            font-size: 28px;
            color: var(--primary);
        }

        .note:nth-child(3) {
            left: 80%;
            animation-delay: 2.5s;
            font-size: 22px;
        }

        .vinyl-record {
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, #111 20%, #333 21%, #111 22%, #333 50%, #111 100%);
            border-radius: 50%;
            margin: 0 auto 24px auto;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            animation: spin 6s linear infinite;
        }

        .vinyl-record::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 30px;
            background: var(--accent);
            border-radius: 50%;
            border: 2px solid white;
        }

        .error-code {
            font-size: 90px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            line-height: 1;
            margin-bottom: 5px;
            filter: drop-shadow(0 0 20px var(--accent-glow));
            font-family: 'SF Pro Display', system-ui, sans-serif;
            letter-spacing: -4px;
        }

        .error-title {
            font-size: 26px;
            margin: 10px 0 12px 0;
            color: var(--text-primary);
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .error-message {
            color: var(--text-secondary);
            margin-bottom: 32px;
            font-size: 16px;
            line-height: 1.6;
        }

        .btn-home {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            text-decoration: none;
            padding: 14px 36px;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .btn-home::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, var(--accent), var(--primary));
            opacity: 0;
            transition: opacity 0.3s;
            z-index: -1;
        }

        .btn-home:hover {
            transform: scale(1.03) translateY(-2px);
            border-color: transparent;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .btn-home:hover::before {
            opacity: 1;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes floatNote {
            0% {
                transform: translateY(20px) rotate(-10deg);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            80% {
                opacity: 1;
            }

            100% {
                transform: translateY(-30px) rotate(10deg);
                opacity: 0;
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
    </style>
</head>

<body>
    <div class="bg-glow"></div>

    <div class="error-container">
        <div class="notes-container">
            <i class="fas fa-music note"></i>
            <i class="fas fa-music note"></i>
            <i class="fas fa-music note"></i>
        </div>

        <div class="vinyl-record"></div>

        <h1 class="error-code">404</h1>
        <h2 class="error-title">Pista No Encontrada</h2>

        <p class="error-message">
            Esta canción parece estar rayada o eliminada.<br>
            La página que buscas no está en nuestra lista de reproducción.
        </p>

        <a href="/" class="btn-home">
            <i class="fas fa-play"></i> Reproducir Inicio
        </a>
    </div>
</body>

</html>
